{% extends "base.html" %}

{% block title %}Ingresar{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-flag-fill fs-1 text-body-secondary"></i>
          <h1 class="h4 mt-2 mb-1">Colegio de Árbitros</h1>
          <p class="text-body-secondary small mb-0">Ingresá con tu cuenta</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" novalidate>
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   value="{{ email }}" autocomplete="username" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
          </button>
        </form>
      </div>
    </div>
    <p class="text-center text-body-secondary small mt-3 mb-0">
      ¿No tenés acceso? Pedíselo al tesorero del colegio.
    </p>
  </div>
</div>
{% endblock %}
