<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CABM{% endblock %} · Colegio de Árbitros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/arbitros">
        <i class="bi bi-flag-fill me-1"></i>CABM
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navPrincipal" aria-controls="navPrincipal"
              aria-expanded="false" aria-label="Menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navPrincipal">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link {% if seccion == 'arbitros' %}active{% endif %}"
               {% if seccion == 'arbitros' %}aria-current="page"{% endif %}
               href="/arbitros">Árbitros</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if seccion == 'partidos' %}active{% endif %}"
               {% if seccion == 'partidos' %}aria-current="page"{% endif %}
               href="/partidos">Partidos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if seccion == 'designaciones' %}active{% endif %}"
               {% if seccion == 'designaciones' %}aria-current="page"{% endif %}
               href="/designaciones">Designaciones</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if seccion == 'tesoreria' %}active{% endif %}"
               {% if seccion == 'tesoreria' %}aria-current="page"{% endif %}
               href="/tesoreria">Panel Tesorero</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle {% if seccion in ('canchas', 'torneos', 'tarifas') %}active{% endif %}"
               href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Datos</a>
            <ul class="dropdown-menu">
              <li>
                <a class="dropdown-item {% if seccion == 'canchas' %}active{% endif %}"
                   href="/canchas">Canchas</a>
              </li>
              <li>
                <a class="dropdown-item {% if seccion == 'torneos' %}active{% endif %}"
                   href="/torneos">Torneos</a>
              </li>
              <li>
                <a class="dropdown-item {% if seccion == 'tarifas' %}active{% endif %}"
                   href="/tarifas">Tarifas</a>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block contenido %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
